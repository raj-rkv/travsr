name: Release

# Two entry points:
#   1. push a tag        -> build fresh artifacts, sign, publish to the tag's channel.
#   2. workflow_dispatch  -> promote an already-published channel's artifacts to the
#                            next channel WITHOUT rebuilding (see the `promote` job).
# Promotion reuses artifacts rather than rebuilding because Rust builds here are not
# bit-reproducible across runs (runner image / cross toolchain drift) — rebuilding on
# every promotion would mean "stable" is never actually the bits that were beta-tested.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
  workflow_dispatch:
    inputs:
      promote_from:
        description: 'Existing release tag to promote (e.g. v0.12.0-beta.1)'
        required: true
      promote_to:
        description: 'New tag to publish (e.g. v0.12.0-rc.1)'
        required: true

permissions:
  contents: write
  id-token: write        # required for cosign keyless signing and SLSA provenance
  attestations: write     # required for actions/attest-build-provenance
  actions: read           # preflight: read check-run status on the tagged commit
  checks: read            # preflight: read check-run status on the tagged commit
  issues: write           # gate-fuzz: fuzz.yml files an issue on a crash
  security-events: write  # gate-osv: osv-scanner-reusable.yml

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.promote_to || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ── Parse the tag (push) or promote_to (dispatch) into a channel ──────────
  channel:
    name: detect channel
    runs-on: ubuntu-latest
    outputs:
      ref:         ${{ steps.d.outputs.ref }}
      channel:     ${{ steps.d.outputs.channel }}
      npm_tag:     ${{ steps.d.outputs.npm_tag }}
      prerelease:  ${{ steps.d.outputs.prerelease }}
      environment: ${{ steps.d.outputs.environment }}
    steps:
      - id: d
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ github.event.inputs.promote_to }}"
          else
            REF="${{ github.ref_name }}"
          fi
          V="${REF#v}"
          case "$V" in
            *-beta.[0-9]*) CH=beta;   TAG=beta;   PRE=true;  ENV=release-beta ;;
            *-rc.[0-9]*)   CH=rc;     TAG=rc;     PRE=true;  ENV=release-rc ;;
            *-*)           echo "unsupported pre-release suffix: $V" >&2; exit 1 ;;
            *)             CH=stable; TAG=latest; PRE=false; ENV=release ;;
          esac
          {
            echo "ref=$REF"
            echo "channel=$CH"
            echo "npm_tag=$TAG"
            echo "prerelease=$PRE"
            echo "environment=$ENV"
          } >> "$GITHUB_OUTPUT"

  # ── Push path only: guard rails before we build anything ───────────────────
  verify-version:
    name: verify tag matches travsr-cli and npm version
    if: github.event_name == 'push'
    needs: [channel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag base version must equal travsr-cli and npm version
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ needs.channel.outputs.ref }}"
          BASE="${BASE#v}"
          BASE="${BASE%%-*}"
          CARGO=$(grep -m1 '^version = ' crates/travsr-cli/Cargo.toml | cut -d'"' -f2)
          NPM=$(node -p "require('./packages/travsr-npm/package.json').version")
          [ "$BASE" = "$CARGO" ] || { echo "tag base $BASE != crates/travsr-cli/Cargo.toml $CARGO" >&2; exit 1; }
          [ "$BASE" = "$NPM" ]   || { echo "tag base $BASE != packages/travsr-npm/package.json $NPM" >&2; exit 1; }
          echo "OK: tag base $BASE matches travsr-cli and npm versions"

      # #486: a stale DOWNLOAD_VERSION makes the vscode extension's
      # "reinstall" advice silently downgrade users. Stable releases must bump
      # it in lockstep. Pre-releases are exempt — bumping there would point the
      # extension at a stable tag that doesn't exist yet.
      - name: vscode DOWNLOAD_VERSION must match tag on stable releases
        if: needs.channel.outputs.channel == 'stable'
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ needs.channel.outputs.ref }}"
          BASE="${BASE#v}"
          DL=$(grep -m1 'export const DOWNLOAD_VERSION' packages/travsr-vscode/src/installer.ts | cut -d'"' -f2)
          [ "$BASE" = "$DL" ] || { echo "tag base $BASE != DOWNLOAD_VERSION $DL in packages/travsr-vscode/src/installer.ts — bump it as part of the release" >&2; exit 1; }
          echo "OK: DOWNLOAD_VERSION $DL matches tag base $BASE"

  preflight:
    name: preflight (CI green on tagged commit)
    if: github.event_name == 'push'
    needs: [channel]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - name: Required checks must be green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REQUIRED=(
            "rustfmt"
            "clippy"
            "test (ubuntu-latest)"
            "test (macos-latest)"
            "test (windows-latest)"
            "lsif-ts (build + test)"
            "MSRV (rust 1.88)"
            "cargo-deny"
            "plugin-hashes.lock"
            "release/installer target maps"
            "TL1/TL2 — zero LLM/embedding deps in travsr-mcp"
            "Phase 2 correctness suite"
            "Bench p95 < 50 ms"
            "RBAC Leak Suite"
            "criterion regression check"
          )
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.conclusion == "success") | .name' > passed.txt
          MISSING=0
          for name in "${REQUIRED[@]}"; do
            if ! grep -qxF "$name" passed.txt; then
              echo "MISSING/FAILED required check: $name"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "One or more required checks are not green on ${GITHUB_SHA}. A release tag must point at a commit where CI already passed on master/main." >&2
            exit 1
          fi
          echo "OK: all required checks green on ${GITHUB_SHA}"

  # ── Push path only: build, sign, publish fresh artifacts ───────────────────
  build:
    name: build (${{ matrix.artifact }})
    if: github.event_name == 'push'
    needs: [channel, verify-version, preflight]
    strategy:
      fail-fast: false
      matrix:
        # artifact: must stay in lockstep with the installer target maps
        # (#576, #691); checked in CI by .github/scripts/check-target-maps.mjs.
        include:
          # musl = statically linked, runs on any Linux regardless of glibc version
          - target: x86_64-unknown-linux-musl
            artifact: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-musl
            artifact: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            artifact: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            artifact: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-pc-windows-msvc
            artifact: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools (x86_64 Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Install cross (aarch64 Linux)
        if: matrix.cross == true
        run: cargo install cross --locked

      - name: Build (cargo)
        if: matrix.cross != true
        run: cargo build --release -p travsr-cli --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross == true
        run: cross build --release -p travsr-cli --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          RUST_TARGET="${{ matrix.target }}"
          ARTIFACT="${{ matrix.artifact }}"
          STAGE="travsr-${TAG}-${ARTIFACT}"
          # Windows binaries are .exe; all others have no extension.
          BIN_EXT=""
          if [[ "$RUST_TARGET" == *windows* ]]; then BIN_EXT=".exe"; fi
          mkdir -p dist
          cp "target/${RUST_TARGET}/release/travsr${BIN_EXT}" "dist/travsr${BIN_EXT}"
          tar -czf "dist/${STAGE}.tar.gz" -C dist "travsr${BIN_EXT}"
          rm "dist/travsr${BIN_EXT}"
          # shasum exists on macOS+Linux but not Git Bash on windows-latest;
          # sha256sum ships with Git for Windows and on Linux runners but not macOS.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/${STAGE}.tar.gz" > "dist/${STAGE}.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "dist/${STAGE}.tar.gz" > "dist/${STAGE}.sha256"
          else
            echo "ERROR: neither sha256sum nor shasum is available on this runner" >&2
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign tarball (keyless - GitHub OIDC)
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          ARTIFACT="${{ matrix.artifact }}"
          STAGE="travsr-${TAG}-${ARTIFACT}"
          # Produces dist/${STAGE}.tar.gz.bundle (Sigstore bundle format).
          cosign sign-blob --yes \
            --bundle "dist/${STAGE}.tar.gz.bundle" \
            "dist/${STAGE}.tar.gz"

      - name: Check tarball size (≤ 25 MB)
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          ARTIFACT="${{ matrix.artifact }}"
          STAGE="travsr-${TAG}-${ARTIFACT}"
          MAX_BYTES=$((25 * 1024 * 1024))
          SIZE=$(wc -c < "dist/${STAGE}.tar.gz")
          if [ "$SIZE" -gt "$MAX_BYTES" ]; then
            echo "ERROR: dist/${STAGE}.tar.gz is ${SIZE} bytes - exceeds 25 MB limit (${MAX_BYTES} bytes)."
            echo "If this is expected, update the budget in this step and docs/adrs/ADR-004-error-taxonomy.md."
            exit 1
          fi
          echo "OK: dist/${STAGE}.tar.gz = ${SIZE} bytes (limit: ${MAX_BYTES})"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: travsr-${{ github.ref_name }}-${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish
    if: github.event_name == 'push'
    needs: [channel, build]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.channel.outputs.environment }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Combine checksums into SHA256SUMS
        run: cat dist/*.sha256 > SHA256SUMS

      - name: Attest build provenance (SLSA v1.0)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # #713: unmatched entries are skipped silently by default. On this path
          # install.sh comes from the tagged checkout so it is correct by
          # construction, but a missing artifact or SHA256SUMS would publish just
          # as quietly. Every entry here is produced by an earlier step, so an
          # unmatched one is a broken job rather than an optional asset.
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.bundle
            SHA256SUMS
            install.sh
          generate_release_notes: true
          prerelease: ${{ needs.channel.outputs.prerelease }}
          make_latest: ${{ needs.channel.outputs.channel == 'stable' }}

      # #713: the assertion that matters is not "every glob matched" but "the URL
      # we tell people to curl works". travsr.com/install.sh redirects to
      # releases/latest/download/install.sh, so a release that ships without the
      # asset breaks the single documented install path for everyone, with a green
      # release and green CI and nothing downstream to notice.
      #
      # Checked against the tag rather than `latest`, because a prerelease does
      # not move `latest` and would otherwise assert someone else's release.
      - name: Assert the installer is actually downloadable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Captured before matching, not piped into `grep -q`. With pipefail
          # set, `grep -q` exits at the first match and the pipeline returns 141
          # if `gh` writes again after the pipe closes, so a present install.sh
          # could read as absent. It does not fire today only because `gh`
          # buffers its output into one write, and `install.sh` sorts first in
          # the asset list, which is the worst case for that race.
          for attempt in 1 2 3 4 5; do
            assets=$(gh release view "$REL_TAG" --repo "$GITHUB_REPOSITORY" \
                       --json assets -q '.assets[].name' || true)
            if grep -qx 'install.sh' <<<"$assets"; then
              # Being listed is not the invariant. #714 is that the *bytes*
              # served are the ones from the promoted ref, so download and
              # compare rather than trusting the name.
              # Retried with the listing rather than run once after it. An asset
              # being listed does not mean it downloads on the first try, and a
              # transient failure here would fail a correct release, which is the
              # flakiness this loop exists to absorb.
              if ! gh release download "$REL_TAG" --repo "$GITHUB_REPOSITORY" \
                     -p install.sh -O served.sh --clobber; then
                echo "install.sh is listed on $REL_TAG but did not download (attempt $attempt), retrying"
                sleep $((attempt * 3))
                continue
              fi
              if ! cmp -s served.sh install.sh; then
                echo "::error::$REL_TAG serves an install.sh that differs from the one attached." >&2
                echo "The published asset is what travsr.com/install.sh hands to users," >&2
                echo "so it has to be byte-identical to the copy this run attached." >&2
                exit 1
              fi
              rm -f served.sh
              echo "install.sh on $REL_TAG downloads and matches ($(wc -c < install.sh) bytes)"
              exit 0
            fi
            echo "install.sh not visible on $REL_TAG yet (attempt $attempt), retrying"
            sleep $((attempt * 3))
          done
          echo "::error::$REL_TAG has no install.sh asset." >&2
          echo "travsr.com/install.sh redirects to releases/latest/download/install.sh," >&2
          echo "so publishing this would 404 the documented one-line installer." >&2
          exit 1

      # #750: the per-tag assertion above proves the release we just cut serves
      # the right installer. It does not prove the pointer users actually hit
      # does, and `travsr.com/install.sh` redirects to
      # `releases/latest/download/install.sh`, not to any tag.
      #
      # Only meaningful when this release claims `latest`, which is the same
      # condition `make_latest` uses. A prerelease does not move the pointer, so
      # asserting it there would check somebody else's release.
      #
      # This repo has already been bitten here: `latest` sat on v0.11.0 while
      # v1.0.0-rc.1 existed, so the installer being served was months older than
      # the newest release.
      - name: Assert the latest pointer serves this installer
        if: needs.channel.outputs.channel == 'stable'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Both halves retry together. Confirming the pointer through the API
          # and then fetching it once assumes the download redirect is already
          # consistent with what the API just reported, and if it lags for a
          # moment a correct release fails the gate. That is the same flakiness
          # the retries here exist to avoid, so the fetch and the compare sit
          # inside the loop rather than after it.
          latest=""
          served=""
          for attempt in 1 2 3 4 5; do
            latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .tag_name || true)
            if [ "$latest" = "$REL_TAG" ]; then
              # Fetched the way a user reaches it rather than through the tag,
              # since the redirect is the thing under test.
              if curl -fsSL -o latest.sh \
                   "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh" \
                 && cmp -s latest.sh install.sh; then
                served="ok"
                break
              fi
              echo "latest names $REL_TAG but does not serve its installer yet (attempt $attempt)"
            else
              echo "latest is '$latest', waiting for it to become '$REL_TAG' (attempt $attempt)"
            fi
            sleep $((attempt * 3))
          done

          if [ "$latest" != "$REL_TAG" ]; then
            echo "::error::latest points at '$latest', not the '$REL_TAG' this run published." >&2
            echo "travsr.com/install.sh redirects to releases/latest/download/install.sh," >&2
            echo "so users would be served the installer from '$latest', not this one." >&2
            exit 1
          fi
          if [ "$served" != "ok" ]; then
            echo "::error::releases/latest/download/install.sh differs from the installer this run attached." >&2
            echo "The pointer names $REL_TAG, so this is the served bytes, not the pointer." >&2
            exit 1
          fi
          rm -f latest.sh
          echo "latest points at $REL_TAG and serves the matching install.sh"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm dependencies
        working-directory: packages/travsr-npm
        run: npm ci --ignore-scripts

      - name: Set npm version from tag
        working-directory: packages/travsr-npm
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Publish npm wrapper (OIDC trusted publishing)
        working-directory: packages/travsr-npm
        # --provenance attaches a Sigstore-verifiable build provenance attestation
        # to the published tarball; OIDC auth + provenance is the npm-recommended
        # publishing posture for CI. --tag routes the version to the channel's
        # npm dist-tag instead of the registry default (latest).
        run: npm publish --access public --provenance --tag "${{ needs.channel.outputs.npm_tag }}"

  # ── Promotion gates: reused CI suites, required past beta / into stable ───
  gate-fuzz:
    name: "gate: fuzz suite"
    if: github.event_name == 'workflow_dispatch' && needs.channel.outputs.channel != 'beta'
    needs: [channel]
    uses: ./.github/workflows/fuzz.yml

  gate-osv:
    name: "gate: OSV scan"
    if: github.event_name == 'workflow_dispatch' && needs.channel.outputs.channel != 'beta'
    needs: [channel]
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/osv-scan.yml

  gate-accuracy:
    name: "gate: accuracy nightly"
    if: github.event_name == 'workflow_dispatch' && needs.channel.outputs.channel != 'beta'
    needs: [channel]
    uses: ./.github/workflows/accuracy-nightly.yml

  gate-ab-eval:
    name: "gate: A/B eval"
    if: github.event_name == 'workflow_dispatch' && needs.channel.outputs.channel == 'stable'
    needs: [channel]
    uses: ./.github/workflows/ab-eval.yml

  # ── Dispatch path only: promote a channel's artifacts, no rebuild ──────────
  promote:
    name: promote (reuse signed artifacts)
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.channel.result == 'success' &&
      (needs['gate-fuzz'].result == 'success' || needs['gate-fuzz'].result == 'skipped') &&
      (needs['gate-osv'].result == 'success' || needs['gate-osv'].result == 'skipped') &&
      (needs['gate-accuracy'].result == 'success' || needs['gate-accuracy'].result == 'skipped') &&
      (needs['gate-ab-eval'].result == 'success' || needs['gate-ab-eval'].result == 'skipped')
    needs: [channel, gate-fuzz, gate-osv, gate-accuracy, gate-ab-eval]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.channel.outputs.environment }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # actions/checkout skips tags by default even with fetch-depth: 0 —
          # without this, resolving $FROM below fails with "unknown revision".
          fetch-tags: true

      - name: Download source release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p src
          gh release download "${{ github.event.inputs.promote_from }}" -D src \
            --pattern '*.tar.gz' --pattern '*.bundle' --pattern 'SHA256SUMS'

      - name: Rename assets to the target tag and regenerate SHA256SUMS
        # Renaming does not touch signed content: cosign signs the blob's digest,
        # not its filename, and the digests themselves are unchanged by this step.
        shell: bash
        run: |
          set -euo pipefail
          FROM="${{ github.event.inputs.promote_from }}"
          TO="${{ github.event.inputs.promote_to }}"
          mkdir -p dist
          shopt -s nullglob
          for f in "src/travsr-${FROM}-"*.tar.gz "src/travsr-${FROM}-"*.tar.gz.bundle; do
            base="$(basename "$f")"
            cp "$f" "dist/${base/travsr-$FROM-/travsr-$TO-}"
          done
          (cd dist && sha256sum *.tar.gz > ../SHA256SUMS)

      - name: Assert promoted tarballs are bit-identical to the source release
        shell: bash
        run: |
          set -euo pipefail
          FROM="${{ github.event.inputs.promote_from }}"
          TO="${{ github.event.inputs.promote_to }}"
          for t in dist/*.tar.gz; do
            name="$(basename "$t")"
            orig="src/${name/travsr-$TO-/travsr-$FROM-}"
            new_hash=$(sha256sum "$t" | cut -d' ' -f1)
            old_hash=$(sha256sum "$orig" | cut -d' ' -f1)
            if [ "$new_hash" != "$old_hash" ]; then
              echo "PROMOTION ABORTED: $name digest differs from $FROM" >&2
              exit 1
            fi
          done
          echo "OK: all promoted tarballs match ${FROM} byte-for-byte"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify reused signatures still validate
        shell: bash
        run: |
          set -euo pipefail
          # Keep this pattern identical to the one in install.sh (search for
          # certificate-identity-regexp there) and to SECURITY.md's manual
          # verification command. A pipeline gate must never be looser than the
          # client it publishes for, or a bundle this job accepts is one the
          # installer rejects, and the failure surfaces on a user's machine
          # instead of here. The ref pattern mirrors on.push.tags above; only
          # the tag-triggered build job signs, and promote reuses those bundles.
          for t in dist/*.tar.gz; do
            cosign verify-blob --bundle "${t}.bundle" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp '^https://github\.com/Travsr-com/travsr/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?$' \
              "$t"
          done

      # #714: `install.sh` is the one attached asset that does not come from the
      # source release, because it is not a build artifact. The checkout above is
      # the dispatch ref, so attaching the working tree's copy would ship
      # master's installer under a tag whose tree may hold a different one, and
      # `releases/<tag>/download/install.sh` would not be a snapshot of `<tag>`.
      #
      # Benign while the script stays version-independent, and a real bug the
      # moment it is not (a pinned default tag, a channel flag, a baked-in
      # version). Rather than rely on that staying true, take it from the
      # promoted tag's own tree.
      #
      # That leaves install.sh sourced differently from everything else here,
      # and deliberately so: every other promoted asset comes from
      # `gh release download` against the source *release*, while this one comes
      # from the source *tag's tree*. Pulling it from the release instead would
      # propagate whatever install.sh that release happened to carry, which for a
      # release cut before #706 is master's copy under a new tag, and that is the
      # bug this exists to stop.
      #
      # The cost, accepted: a ref that predates install.sh being tracked cannot
      # be promoted at all, even when its published release carries a perfectly
      # good installer asset. Failing loudly there is preferred over promoting a
      # release whose installer does not correspond to its own tree.
      #
      # Ordered before the tag push deliberately. It needs only the checkout,
      # and running it afterwards meant tripping it left a public tag with no
      # release attached, which the next attempt could not recover from:
      # `fetch-tags: true` refetches that tag, so `git tag` fails on it and the
      # operator has to delete it by hand before re-running.
      #
      # #713: a ref that predates install.sh existing has nothing to extract.
      # `action-gh-release` defaults `fail_on_unmatched_files: false`, so that
      # would silently publish a release with no installer, and
      # travsr.com/install.sh (a redirect to releases/latest/download/install.sh)
      # would start 404ing for everyone with a green release and green CI.
      # Failing here is the loud alternative.
      - name: Take install.sh from the promoted tag's tree
        shell: bash
        env:
          FROM_TAG: ${{ github.event.inputs.promote_from }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "$FROM_TAG:install.sh" 2>/dev/null; then
            echo "::error::$FROM_TAG has no install.sh in its tree." >&2
            echo "Promoting it would publish a release without the installer that" >&2
            echo "travsr.com/install.sh redirects to, and the release would still" >&2
            echo "be green. Promote a ref that carries install.sh." >&2
            exit 1
          fi
          git show "$FROM_TAG:install.sh" > install.sh
          chmod +x install.sh
          echo "install.sh taken from $FROM_TAG ($(wc -c < install.sh) bytes)"

      - name: Create the promoted tag on the same commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FROM="${{ github.event.inputs.promote_from }}"
          TO="${{ github.event.inputs.promote_to }}"
          SHA=$(git rev-list -n1 "$FROM")
          git tag "$TO" "$SHA"
          # Pushed via the default GITHUB_TOKEN: GitHub does not start new
          # workflow runs for events triggered by that token, so this tag push
          # does NOT re-enter the `push: tags:` build path. Promotion never rebuilds.
          git push origin "$TO"

      - name: Create promoted GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.promote_to }}
          # #713: a listed file that does not exist is skipped silently by
          # default. Every entry here is either produced by an earlier step in
          # this job or asserted above, so an unmatched one means the job is
          # wrong, not that the asset is optional.
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.bundle
            SHA256SUMS
            install.sh
          generate_release_notes: true
          prerelease: ${{ needs.channel.outputs.prerelease }}
          make_latest: ${{ needs.channel.outputs.channel == 'stable' }}

      - name: Assert the installer is actually downloadable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: ${{ github.event.inputs.promote_to }}
        run: |
          set -euo pipefail
          # Captured before matching, not piped into `grep -q`. With pipefail
          # set, `grep -q` exits at the first match and the pipeline returns 141
          # if `gh` writes again after the pipe closes, so a present install.sh
          # could read as absent. It does not fire today only because `gh`
          # buffers its output into one write, and `install.sh` sorts first in
          # the asset list, which is the worst case for that race.
          for attempt in 1 2 3 4 5; do
            assets=$(gh release view "$REL_TAG" --repo "$GITHUB_REPOSITORY" \
                       --json assets -q '.assets[].name' || true)
            if grep -qx 'install.sh' <<<"$assets"; then
              # Being listed is not the invariant. #714 is that the *bytes*
              # served are the ones from the promoted ref, so download and
              # compare rather than trusting the name.
              # Retried with the listing rather than run once after it. An asset
              # being listed does not mean it downloads on the first try, and a
              # transient failure here would fail a correct release, which is the
              # flakiness this loop exists to absorb.
              if ! gh release download "$REL_TAG" --repo "$GITHUB_REPOSITORY" \
                     -p install.sh -O served.sh --clobber; then
                echo "install.sh is listed on $REL_TAG but did not download (attempt $attempt), retrying"
                sleep $((attempt * 3))
                continue
              fi
              if ! cmp -s served.sh install.sh; then
                echo "::error::$REL_TAG serves an install.sh that differs from the one attached." >&2
                echo "The published asset is what travsr.com/install.sh hands to users," >&2
                echo "so it has to be byte-identical to the copy this run attached." >&2
                exit 1
              fi
              rm -f served.sh
              echo "install.sh on $REL_TAG downloads and matches ($(wc -c < install.sh) bytes)"
              exit 0
            fi
            echo "install.sh not visible on $REL_TAG yet (attempt $attempt), retrying"
            sleep $((attempt * 3))
          done
          echo "::error::$REL_TAG has no install.sh asset." >&2
          echo "This is the promote path, where the ref being promoted may predate" >&2
          echo "install.sh existing. travsr.com/install.sh redirects to" >&2
          echo "releases/latest/download/install.sh, so this would 404 the" >&2
          echo "documented one-line installer." >&2
          exit 1

      # #750: the per-tag assertion above proves the release we just cut serves
      # the right installer. It does not prove the pointer users actually hit
      # does, and `travsr.com/install.sh` redirects to
      # `releases/latest/download/install.sh`, not to any tag.
      #
      # Only meaningful when this release claims `latest`, which is the same
      # condition `make_latest` uses. A prerelease does not move the pointer, so
      # asserting it there would check somebody else's release.
      #
      # This repo has already been bitten here: `latest` sat on v0.11.0 while
      # v1.0.0-rc.1 existed, so the installer being served was months older than
      # the newest release.
      - name: Assert the latest pointer serves this installer
        if: needs.channel.outputs.channel == 'stable'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: ${{ github.event.inputs.promote_to }}
        run: |
          set -euo pipefail
          # Both halves retry together. Confirming the pointer through the API
          # and then fetching it once assumes the download redirect is already
          # consistent with what the API just reported, and if it lags for a
          # moment a correct release fails the gate. That is the same flakiness
          # the retries here exist to avoid, so the fetch and the compare sit
          # inside the loop rather than after it.
          latest=""
          served=""
          for attempt in 1 2 3 4 5; do
            latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .tag_name || true)
            if [ "$latest" = "$REL_TAG" ]; then
              # Fetched the way a user reaches it rather than through the tag,
              # since the redirect is the thing under test.
              if curl -fsSL -o latest.sh \
                   "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh" \
                 && cmp -s latest.sh install.sh; then
                served="ok"
                break
              fi
              echo "latest names $REL_TAG but does not serve its installer yet (attempt $attempt)"
            else
              echo "latest is '$latest', waiting for it to become '$REL_TAG' (attempt $attempt)"
            fi
            sleep $((attempt * 3))
          done

          if [ "$latest" != "$REL_TAG" ]; then
            echo "::error::latest points at '$latest', not the '$REL_TAG' this run published." >&2
            echo "travsr.com/install.sh redirects to releases/latest/download/install.sh," >&2
            echo "so users would be served the installer from '$latest', not this one." >&2
            exit 1
          fi
          if [ "$served" != "ok" ]; then
            echo "::error::releases/latest/download/install.sh differs from the installer this run attached." >&2
            echo "The pointer names $REL_TAG, so this is the served bytes, not the pointer." >&2
            exit 1
          fi
          rm -f latest.sh
          echo "latest points at $REL_TAG and serves the matching install.sh"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm dependencies
        working-directory: packages/travsr-npm
        run: npm ci --ignore-scripts

      - name: Set npm version to the promoted tag
        working-directory: packages/travsr-npm
        run: npm version --no-git-tag-version --allow-same-version "$(echo "${{ github.event.inputs.promote_to }}" | sed 's/^v//')"

      - name: Publish npm wrapper under the target channel's dist-tag
        working-directory: packages/travsr-npm
        run: npm publish --access public --provenance --tag "${{ needs.channel.outputs.npm_tag }}"

  # ── Distribution smoke test: the actual "testing environment" a channel feeds ──
  smoke:
    name: smoke install (${{ matrix.os }})
    if: |
      always() &&
      (needs.publish.result == 'success' || needs.promote.result == 'success')
    needs: [channel, publish, promote]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install cosign (so postinstall takes the verify path, not the degraded one)
        uses: sigstore/cosign-installer@v3

      - name: Install travsr from the ${{ needs.channel.outputs.npm_tag }} channel
        shell: bash
        run: npm i -g "@travsr.com/travsr@${{ needs.channel.outputs.npm_tag }}"

      - name: Verify binary runs
        shell: bash
        run: travsr --version

      - name: Smoke test travsr init
        shell: bash
        run: |
          set -euo pipefail
          mkdir smoke-repo && cd smoke-repo
          git init -q
          git -c user.email=ci@travsr.com -c user.name=ci commit --allow-empty -q -m init
          travsr init

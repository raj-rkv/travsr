name: OSV Scan

# Runs once per day to scan Rust and npm dependencies for known CVEs
# using the Google OSV database. Also triggerable manually.

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily
  workflow_dispatch:        # manual trigger from GitHub Actions UI
  workflow_call:            # invoked as a release-promotion gate by release.yml

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  osv-scan-rust:
    name: OSV scan (Rust)
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.1
    with:
      scan-args: |-
        --lockfile=Cargo.lock

  osv-scan-npm:
    name: OSV scan (npm — travsr-lsif-ts)
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.1
    with:
      scan-args: |-
        --lockfile=packages/travsr-lsif-ts/package-lock.json

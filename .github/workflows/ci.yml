name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
  # A published release is the only time the release-artifact sanity job has
  # something to download, so it is a trigger here rather than in a separate
  # workflow. The other jobs run too, which is a few extra runner minutes once
  # per release; `preflight` in release.yml already required them green on the
  # tagged commit, so treat it as confirmation rather than new signal.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      sanity_tag:
        description: 'Release tag to verify with the sanity suite (e.g. v1.0.0-rc.1). Leave blank to skip.'
        required: false
      sanity_with_cpp:
        description: 'Sanity: also exercise c/c++ (needs the scip-clang sidecar on the runner)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install bubblewrap (Linux sandbox enforcement tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04+ ships an AppArmor profile that blocks bwrap from creating
          # mount/user namespaces even with sudo. Unload the profile so our sandbox
          # enforcement tests (security.rs) can actually run bwrap.
          for profile in /etc/apparmor.d/bwrap /etc/apparmor.d/usr.bin.bwrap; do
            if [ -f "$profile" ]; then
              sudo apparmor_parser -R "$profile" && echo "Unloaded AppArmor profile: $profile" || true
            fi
          done
          # Also disable the global AppArmor user-namespace restriction (Ubuntu 24.04 kernel).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          # Verify bwrap can actually create a sandbox — fail this step loudly if not,
          # so any remaining restriction is caught before cargo test runs.
          # Include /lib and /lib64: on merged-usr systems these are host symlinks
          # to /usr/lib{,64} and must be mounted explicitly inside bwrap's tmpfs root
          # so the dynamic linker (/lib64/ld-linux-x86-64.so.2) is reachable.
          bwrap --ro-bind-try /usr /usr --ro-bind-try /lib /lib --ro-bind-try /lib64 /lib64 --proc /proc --dev /dev -- true

      - name: Run tests
        run: cargo test --workspace

  lsif-ts:
    name: lsif-ts (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/travsr-lsif-ts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/travsr-lsif-ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  msrv:
    name: MSRV (rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # To bump MSRV: update rust-version in Cargo.toml, update the toolchain
      # version below AND the RUSTUP_TOOLCHAIN value in the check step (both,
      # they are not linked), and add a changelog entry.
      #
      # The job `name:` above carries the version, and release.yml's preflight
      # matches required checks by exact name, so renaming this job without
      # editing that list makes every release tag fail preflight on a check
      # that no longer exists. The 1.75 to 1.88 bump did exactly that.
      # clippy.toml's `msrv` is a third copy; raising it unlocks newer lints,
      # so it is a code change, not a rename, and belongs in its own commit.
      #
      # The version is also quoted in prose: CONTRIBUTING.md, ADR-001, and
      # packages/travsr-npm/README.md all state it, and Cargo.toml comments
      # justify pins against it. So before bumping, run
      #     grep -rn "1\.88" --include='*.md' --include='*.toml' --include='*.yml'
      # with the OLD version and fix every hit. Skip CHANGELOG.md and the
      # RFC-012 addendum: those record what was true at the time. Rationale
      # that cites the MSRV needs rereading, not just renumbering; the 1.75
      # bump left a Cargo.toml note whose reason had expired at the new value.
      - name: Install Rust toolchain (1.88.0)
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      # RUSTUP_TOOLCHAIN is mandatory here, do not remove it. The repo root has
      # a rust-toolchain.toml pinning `channel = "stable"`, and a directory
      # override outranks the default toolchain that dtolnay/rust-toolchain
      # sets. Without this env the step silently ran `cargo check` on stable,
      # so this job reported success for the entire time it claimed to verify
      # 1.75 while the lockfile had long since drifted past it. The env var
      # outranks the override file and is the only thing that makes this job
      # test what its name says.
      - name: Check workspace compiles on MSRV
        run: cargo check --workspace
        env:
          RUSTUP_TOOLCHAIN: 1.88.0

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check advisories, licenses, and bans
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

      # fuzz/ is a separate workspace with its own Cargo.lock (isolated so
      # cargo-fuzz can use nightly), so the run above never sees it. That gap
      # let a vulnerable quinn-proto sit in fuzz/Cargo.lock while the root
      # lockfile was already patched. Reuses the root deny.toml. Advisories
      # only: the fuzz package itself is unpublished and carries no license
      # field, which the licenses check would reject.
      #
      # RUSTUP_TOOLCHAIN neutralizes fuzz/rust-toolchain.toml, which pins
      # nightly for cargo-fuzz's sanitizer flags. cargo-deny only reads the
      # manifest and lockfile, so it does not need nightly, and without this
      # the step made the container install a whole nightly toolchain and then
      # failed its crates-index fetch looking for `stable`, degrading to
      # "unable to check for yanked crates" while still exiting 0. rustup
      # auto-installs whatever this names, matching the root step above.
      - name: Check advisories (fuzz workspace)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: fuzz/Cargo.toml
          command: check advisories
          arguments: --all-features --config deny.toml
        env:
          RUSTUP_TOOLCHAIN: stable

  advisory-expiry:
    name: advisory ignore expiry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Deliberately on PR CI rather than the nightly. osv-scanner.toml feeds
      # gate-osv in release.yml, so a lapsed ignore blocks promotions, and the
      # nightly is not a reliable place to learn that: four scheduled
      # workflows were chronically red when this was added (OSV Scan alone had
      # failed 76 nightlies running). Warns at 60 days, fails at 14.
      - name: warn before an osv-scanner ignore lapses
        run: bash .github/scripts/check-advisory-expiry.sh

  plugin-hashes:
    name: plugin-hashes.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify plugin source hashes (ADR-017 Rule 5)
        run: bash .github/scripts/check-plugin-hashes.sh

  em-dash:
    name: no em-dash in user-facing strings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check em/en-dash (both literal and \u{2014} spellings)
        run: bash .github/scripts/check-em-dash.sh

  automation-selftest:
    name: automation self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Stdlib only and no travsr binary, so this costs seconds and can gate every
      # PR. It guards the harness itself, which has had real bugs: a corpus name
      # scraped with a stray backtick that was written to the caller's own config,
      # and a state-dependent skip that silently disabled every c/c++ check on the
      # machines that had run it most. A checker whose failures are silent is worse
      # than no checker.
      - name: travsrAutomation self-test
        run: python3 travsrAutomation/selftest.py

  automation-regression:
    name: automation regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: automation-regression

      # Debug, not release: this indexes a 7-file fixture, so compile time
      # dominates and a release build would roughly double the job for no signal.
      - name: Build travsr
        run: cargo build -p travsr-cli --bin travsr

      # No --with-cpp: c/c++ need the scip-clang sidecar, which is not installed
      # on a runner. The suite reports those as SKIP rather than passing them
      # silently, which is why --strict-skip is not used here.
      #
      # Native Phase B (rust, typescript, python) needs no sidecar, so the
      # cross-language and honesty phases are real coverage on a bare runner.
      - name: Run the regression suite
        run: |
          python3 travsrAutomation/run.py \
            --binary target/debug/travsr \
            --json sanity.json \
            --junit sanity.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-regression-results
          path: |
            sanity.json
            sanity.xml
          if-no-files-found: warn

  automation-sanity:
    name: automation sanity (${{ matrix.os }})
    # Only when there is a published artifact to check: a release event, or a
    # dispatch that named a tag. Skipped on every push and pull request, because
    # `--tag` has nothing to download there.
    if: github.event_name == 'release' || github.event.inputs.sanity_tag != ''
    strategy:
      fail-fast: false
      matrix:
        # Both, deliberately. The functional phases only ever execute the host's
        # own binary, so a single runner would leave the other platform's artifact
        # verified by byte inspection alone.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Every `${{ }}` below is bound through `env:` rather than interpolated
      # into the script body. GitHub substitutes those expressions into the shell
      # source before bash ever parses it, so a dispatch input or a tag name of
      # the form `x"; curl ... | sh; #` would execute as script, not data, in a
      # job that runs `gh` with a repo token. `set -euo pipefail` is no defence:
      # the injected text IS the script.
      - name: Resolve the tag under test
        id: t
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.sanity_tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$RELEASE_TAG}"
          [ -n "$TAG" ] || { echo "no tag to verify" >&2; exit 1; }
          # A tag is a git ref, so anything outside this set is not one, and
          # rejecting it here keeps the value from reaching `gh` at all.
          case "$TAG" in
            *[!A-Za-z0-9._/-]*) echo "refusing tag with unexpected characters: $TAG" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "verifying $TAG"

      # Downloads the release with `gh`, which is preinstalled on hosted runners.
      #
      # No --strict-skip: cosign and the c/c++ sidecars are legitimately absent on
      # a bare runner, and the suite lists every skip in its summary rather than
      # folding one into a pass, so failing on those would make this red for
      # reasons that are not about the release.
      - name: Sanity suite against the published artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SANITY_TAG: ${{ steps.t.outputs.tag }}
          WITH_CPP: ${{ github.event.inputs.sanity_with_cpp }}
          OS_LABEL: ${{ matrix.os }}
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "$WITH_CPP" = "true" ]; then
            EXTRA="--with-cpp"
          fi
          python3 travsrAutomation/run.py \
            --tag "$SANITY_TAG" \
            $EXTRA \
            --json "sanity-$OS_LABEL.json" \
            --junit "sanity-$OS_LABEL.xml"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-sanity-${{ matrix.os }}
          path: |
            sanity-${{ matrix.os }}.json
            sanity-${{ matrix.os }}.xml
          if-no-files-found: warn

      # A published release that fails this is worth surfacing beyond a red check,
      # since by then users can already download it.
      - name: Summarise
        if: always()
        shell: bash
        env:
          OS_LABEL: ${{ matrix.os }}
        run: |
          F="sanity-$OS_LABEL.json"
          if [ ! -f "$F" ]; then
            echo "### Release sanity produced no results on $OS_LABEL" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 travsrAutomation/summarise.py "$F" "$OS_LABEL" >> "$GITHUB_STEP_SUMMARY"

  target-maps:
    name: release/installer target maps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify release matrix and installer target maps agree (#576)
        run: node .github/scripts/check-target-maps.mjs

  install-sh-lint:
    name: "install.sh (shellcheck)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck if missing
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi

      - name: shellcheck install.sh
        run: shellcheck -s sh install.sh

      - name: Truncated-pipe safety guard (#691)
        run: |
          [ "$(tail -n 1 install.sh)" = 'main "$@"' ] || { echo "install.sh must end with main \"\$@\" so a truncated download cannot half-execute (#691)"; exit 1; }

      # The last line alone is necessary but not sufficient: what actually makes
      # a truncated pipe safe is that nothing above main "$@" runs at top level.
      # Strip function bodies, then assert no command substitution survives.
      - name: No top-level command substitution (#691)
        run: |
          if awk 'BEGIN{d=0} /^[A-Za-z_][A-Za-z0-9_]*\(\) *\{/{d=1;next} /^\}/{d=0;next} d==0' install.sh \
               | grep -nE '\$\(|`'; then
            echo "install.sh must not run command substitution at top level (#691)"; exit 1
          fi

      - name: POSIX syntax check
        run: sh -n install.sh && dash -n install.sh

  install-sh:
    name: "install.sh (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            expected: x86_64-unknown-linux-gnu
            cosign: true
          - os: macos-latest
            # macos-latest is arm64 today; hardcode so a runner-arch change fails loudly.
            expected: aarch64-apple-darwin
            cosign: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cosign
        if: matrix.cosign
        uses: sigstore/cosign-installer@v3

      - name: Assert detected target triple
        run: |
          [ "$(cat install.sh | sh -s -- --print-target)" = "${{ matrix.expected }}" ]

      # Piping through cat exercises the real curl|sh stdin-is-the-pipe path
      # and the "sh -s --" argument form, not a plain sh ./install.sh.
      - name: Install travsr via piped install.sh
        run: cat install.sh | sh

      - name: Verify installed binary
        run: |
          "$HOME/.local/bin/travsr" --version

      # Pins to a fixed older release to prove --version actually installs the
      # requested tag rather than silently falling back to latest (#691).
      # The pin MUST stay a release that is not `latest`, otherwise "installed
      # the pinned tag" and "ignored the flag and took latest" are byte-identical
      # and this step passes either way. The guard below fails loudly if a future
      # release ever makes v0.10.0 the latest again.
      - name: Install a pinned older version via --version
        run: |
          export TRAVSR_INSTALL_DIR="$RUNNER_TEMP/pinned"
          latest=$(curl -fsSLI --proto '=https' --proto-redir '=https' -o /dev/null \
            -w '%{url_effective}' https://github.com/Travsr-com/travsr/releases/latest)
          [ "${latest##*/}" != "v0.10.0" ] || { echo "pin v0.10.0 is now latest; repin this test"; exit 1; }
          cat install.sh | sh -s -- --version v0.10.0
          [ "$("$RUNNER_TEMP/pinned/travsr" --version)" = "travsr 0.10.0" ]

      # --version "" must fail rather than silently install latest (#691).
      - name: Reject an empty --version value
        run: |
          export TRAVSR_INSTALL_DIR="$RUNNER_TEMP/empty-version"
          if cat install.sh | sh -s -- --version ""; then
            echo "install.sh accepted an empty --version and did not fail"; exit 1
          fi
          [ ! -e "$RUNNER_TEMP/empty-version/travsr" ]

  install-sh-alpine:
    name: "install.sh (alpine musl)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Not a container: job, because alpine:3 lacks the node*_alpine externals
      # that JS actions (checkout, cosign-installer) require.
      - name: Install and run install.sh inside alpine:3
        run: |
          docker run --rm -v "$PWD:/w" -w /w alpine:3 sh -c '
            set -eu
            apk add --no-cache ca-certificates curl tar >/dev/null
            [ "$(cat install.sh | sh -s -- --print-target)" = x86_64-unknown-linux-gnu ]
            cat install.sh | sh
            /root/.local/bin/travsr --version
          '

  llm-dep-gate:
    name: TL1/TL2 — zero LLM/embedding deps in travsr-mcp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: TL1 — assert travsr-mcp pulls zero LLM dependencies (all configs)
        # Fail the build if any LLM provider crate appears in the dep tree.
        # RFC-012 A1 mandates: travsr-mcp must compile with zero LLM deps in
        # all configurations so the daemon never requires a model/key at runtime.
        run: |
          if cargo tree -p travsr-mcp 2>/dev/null | grep -iE 'anthropic|openai|llama|llm|mistral|cohere|gemini'; then
            echo "FAIL: travsr-mcp has LLM provider dependency (TL1 violation)"
            exit 1
          fi
          echo "OK: travsr-mcp has zero LLM provider dependencies"

      - name: TL2 — workspace default build has zero embedding deps (cargo tree + metadata)
        # RFC-018: ort / sqlite-vec live in travsr-embed repo, never in this workspace.
        # Two complementary checks:
        #   A) cargo tree: dep tree of travsr-mcp in default config (catches transitive pulls)
        #   B) cargo metadata: workspace-level non-optional dep set (catches accidental direct adds)
        run: |
          # tract-onnx is exempt: RFC-021 §15 ratified the in-process cross-encoder
          # reranker (travsr-rerank) as a MANDATORY, non-optional dependency of
          # travsr-mcp. tract is a pure-Rust inference engine (no ort/onnxruntime
          # C++ runtime, no model server) — it is not an embedding dependency and
          # does not violate the RFC-018 "ort/sqlite-vec live in travsr-embed" rule.
          # The guard still bans the real embedding runtime (ort, sqlite-vec, etc.).
          if cargo tree -p travsr-mcp --no-default-features 2>/dev/null | grep -iE '\bort\b|\bonnx\b|\bcandle\b|\bfastembed\b|\busearch\b|\bsqlite-vec\b|\bvec0\b' | grep -viE 'tract-onnx'; then
            echo "FAIL: travsr-mcp has embedding dependency in default config (TL2-A violation)"
            exit 1
          fi
          echo "OK (TL2-A): travsr-mcp dep tree is embedding-free in default config (tract-onnx reranker exempt)"
          cargo metadata --no-deps --format-version 1 \
            | python3 -c "
          import sys, json
          meta = json.load(sys.stdin)
          deps = {d['name'] for pkg in meta['packages']
                  for d in pkg.get('dependencies', [])
                  if not d.get('optional', False)}
          banned = {'ort', 'sqlite-vec'} & deps
          assert not banned, f'Embedding dep leaked into default workspace build: {banned}'
          "
          echo "OK (TL2-B): ort and sqlite-vec absent from workspace non-optional deps"
